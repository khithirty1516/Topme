<script>

let myListing = {
  published: false,
  title: "",
  category: "",
  url: "",
  country: "",
  description: "",
  boosts: 0,
  lastFresh: 0
};

let toastTimer;


/* =========================
   STORAGE
========================= */

function saveMyListing(){

  localStorage.setItem(
    "topme_listing",
    JSON.stringify(myListing)
  );

}


function loadMyListing(){

  const saved =
    localStorage.getItem("topme_listing");

  if(saved){

    try{
      myListing = JSON.parse(saved);
    }catch(error){
      console.log(error);
    }

  }

}


/* =========================
   MODAL
========================= */

function openListingModal(){

  const modal =
    document.getElementById("listingModal");

  modal.classList.add("open");

  document.body.style.overflow = "hidden";

  if(myListing.published){

    showSuccess();

  }else{

    showForm();

  }

}


function closeListingModal(){

  document
    .getElementById("listingModal")
    .classList.remove("open");

  document.body.style.overflow = "";

}


function showForm(){

  document.getElementById("listingForm")
    .style.display = "block";

  document.getElementById("checkout")
    .style.display = "none";

  document.getElementById("success")
    .style.display = "none";

}


function showCheckout(){

  document.getElementById("listingForm")
    .style.display = "none";

  document.getElementById("checkout")
    .style.display = "block";

  document.getElementById("success")
    .style.display = "none";

}


function showSuccess(){

  document.getElementById("listingForm")
    .style.display = "none";

  document.getElementById("checkout")
    .style.display = "none";

  document.getElementById("success")
    .style.display = "block";

  updateBoostCount();

}


/* =========================
   LISTING FORM
========================= */

function startListingCheckout(){

  const title =
    document.getElementById("title")
      .value.trim();

  const url =
    document.getElementById("url")
      .value.trim();

  if(!title){

    showToast(
      "Enter a name or title first."
    );

    return;
  }

  if(!url){

    showToast(
      "Enter your profile or item link."
    );

    return;
  }

  myListing.title = title;

  myListing.category =
    document.getElementById("category").value;

  myListing.url = url;

  myListing.country =
    document.getElementById("country").value;

  myListing.description =
    document.getElementById("description")
      .value.trim();

  showCheckout();

}


/* =========================
   ₹49 ENTRY PAYMENT
========================= */

function completeListingPayment(){

  myListing.published = true;

  myListing.boosts = 0;

  myListing.lastFresh = Date.now();

  saveMyListing();

  addMyListingToBoard();

  showSuccess();

  showToast(
    "🔥 Listing published for ₹49!"
  );

}


/* =========================
   ADD USER LISTING
   TO LEADERBOARD
========================= */

function addMyListingToBoard(){

  const board =
    document.getElementById("leaderboard");

  if(!board){
    return;
  }

  let existing =
    document.getElementById("my-topme-row");

  if(existing){
    existing.remove();
  }

  const row =
    document.createElement("div");

  row.className = "rank-row";

  row.id = "my-topme-row";

  row.dataset.name =
    myListing.title;

  row.innerHTML = `

    <div class="rank top">
      #1
    </div>

    <div class="item">

      <div class="avatar">
        🔥
      </div>

      <div class="item-info">

        <div class="item-name">
          ${escapeHTML(myListing.title)}
        </div>

        <div class="item-meta">
          ${escapeHTML(myListing.category)}
          · ${escapeHTML(myListing.country)}
        </div>

      </div>

    </div>

    <div class="amount">

      <strong>
        ₹${49 + (myListing.boosts * 49)}
      </strong>

      <button
        class="boost-button"
        onclick="boostMyListing()">

        🔥 ₹49 Boost

      </button>

    </div>

  `;

  board.prepend(row);

  updateRanks();

}


/* =========================
   BOOST
========================= */

function boostMyListing(){

  if(!myListing.published){

    showToast(
      "You need to publish your listing first."
    );

    return;
  }

  /*
    DEMO PAYMENT:

    Every click represents
    another ₹49 successful boost.

    Real payment gateway can
    be connected later.
  */

  const confirmed =
    confirm(
      "🔥 Fresh Boost\n\n" +
      "Price: ₹49\n\n" +
      "Your listing will move to #1."
    );

  if(!confirmed){
    return;
  }

  myListing.boosts++;

  myListing.lastFresh =
    Date.now();

  saveMyListing();

  addMyListingToBoard();

  showSuccess();

  showToast(
    "🔥 Boost successful! You are #1."
  );

  setTimeout(function(){

    scrollToBoard();

  },500);

}


/* =========================
   DEMO EXISTING LISTING BOOST
========================= */

function boostDemo(name){

  const confirmed =
    confirm(
      "🔥 Fresh Boost for " +
      name +
      "\n\n" +
      "Price: ₹49\n\n" +
      "Demo payment only."
    );

  if(!confirmed){
    return;
  }

  showToast(
    "🔥 " + name +
    " received a fresh boost!"
  );

}


/* =========================
   UPDATE RANKS
========================= */

function updateRanks(){

  const rows =
    Array.from(
      document.querySelectorAll(
        "#leaderboard .rank-row"
      )
    );

  rows.forEach(function(row,index){

    const rank =
      row.querySelector(".rank");

    if(!rank){
      return;
    }

    rank.innerText =
      "#" + (index + 1);

    rank.classList.remove("top");

    if(index === 0){

      rank.classList.add("top");

    }

  });

}


/* =========================
   BOOST COUNT
========================= */

function updateBoostCount(){

  const element =
    document.getElementById(
      "myBoostCount"
    );

  if(element){

    element.innerText =
      "Fresh boosts: " +
      myListing.boosts;

  }

}


/* =========================
   FILTERS
========================= */

function setupFilters(){

  const filters =
    document.querySelectorAll(
      ".filter"
    );

  filters.forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        filters.forEach(function(btn){

          btn.classList.remove(
            "active"
          );

        });

        this.classList.add("active");

        showToast(
          this.innerText.trim() +
          " selected"
        );

      }
    );

  });

}


/* =========================
   CATEGORIES
========================= */

function setupCategories(){

  const categories =
    document.querySelectorAll(
      ".category"
    );

  categories.forEach(function(card){

    card.style.cursor = "pointer";

    card.addEventListener(
      "click",
      function(){

        const category =
          this.querySelector(
            ".category-name"
          );

        if(category){

          showToast(
            category.innerText +
            " selected"
          );

          scrollToBoard();

        }

      }
    );

  });

}


/* =========================
   SHARE
========================= */

function shareMyListing(){

  const text =
    "I'm on TOPME 🔥\n" +
    "Can you TOPME me?";

  if(navigator.share){

    navigator.share({

      title: "My TOPME listing",

      text: text

    }).catch(function(){});

  }else{

    navigator.clipboard
      .writeText(text)
      .then(function(){

        showToast(
          "Share text copied!"
        );

      });

  }

}


/* =========================
   SCROLL
========================= */

function scrollToBoard(){

  const board =
    document.getElementById(
      "explore"
    );

  if(board){

    board.scrollIntoView({
      behavior: "smooth"
    });

  }

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  if(!toast){
    return;
  }

  toast.innerText =
    message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(function(){

      toast.classList.remove(
        "show"
      );

    },2800);

}


/* =========================
   BACK
========================= */

function backToForm(){

  showForm();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   MODAL OUTSIDE CLICK
========================= */

const modal =
  document.getElementById(
    "listingModal"
  );

if(modal){

  modal.addEventListener(
    "click",
    function(event){

      if(event.target === this){

        closeListingModal();

      }

    }
  );

}


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeListingModal();

    }

  }
);


/* =========================
   STARTUP
========================= */

loadMyListing();

setupFilters();

setupCategories();

if(myListing.published){

  addMyListingToBoard();

}

</script>
